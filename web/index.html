<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GCS - Drone ASR Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Navigation de Drone</h1>
        <p>Simulation 3D. [Z/S] Alt | [Q/D] Roll | [A/E] Pitch | [X] Quitter</p>
    </div>
    
    <div class="main-content">
        
        <div class="dashboard">
            <div class="view-panel">
                <h3>Élévation : Vue depuis l'arrière</h3>
                <canvas id="canvasProfile" width="800" height="400"></canvas>
            </div>

            <div class="view-panel">
                <h3>Navigation : Vue de Dessus</h3>
                <canvas id="canvasTop" width="800" height="400"></canvas>
            </div>
        </div>

        <div class="side-panel">
            <div class="legend">
                <h3>Légende</h3>
                <div class="legend-items">
                    <div class="legend-item"><span class="color-box" style="background: #fab387; border-radius: 50%;"></span> Utilisateurs</div>
                    <div class="legend-item"><span class="color-box" style="background: rgba(166, 227, 161, 0.3); border: 1px solid #a6e3a1;"></span> Arbres / Obstacles</div>
                    <div class="legend-item"><span class="color-box" style="background: transparent; border: 2px solid #f9e2af; box-shadow: 0 0 8px #f9e2af;"></span> Focus LiDAR</div>
                    <div class="legend-item"><span class="color-box" style="background: #a6e3a1;"></span> Lien WiFi Fort</div>
                </div>
            </div>

            <button id="btnRestart" class="btn-primary">
                Relancer la simulation<br><small>(Nouvelle Map Aléatoire)</small>
            </button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
