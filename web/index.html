<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GCS - Drone ASR Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Navigation de Drone</h1>
        <p>Simulation 3D. [Z/S] Alt | [Q/D] Roll | [A/E] Pitch | [X] Quitter</p>
    </div>
    
    <div class="dashboard">
        <!-- Vue de Profil EN HAUT -->
        <div class="view-panel">
            <h3>Élévation : Vue depuis l'arrière (Gauche/Droite = Roll, Altitude)</h3>
            <canvas id="canvasProfile" width="800" height="400"></canvas>
        </div>

        <!-- Vue de Dessus EN BAS -->
        <div class="view-panel">
            <h3>Navigation : Vue de Dessus (Gauche/Droite = Roll, Avant/Arrière = Pitch)</h3>
            <canvas id="canvasTop" width="800" height="400"></canvas>
        </div>
    </div>

    <div class="legend">
        <h3>Qualité du Signal Global</h3>
        <div class="legend-items">
            <div class="legend-item"><span class="color-box" style="background: #a6e3a1;"></span> Excellent</div>
            <div class="legend-item"><span class="color-box" style="background: #f9e2af;"></span> Moyen</div>
            <div class="legend-item"><span class="color-box" style="background: #f38ba8;"></span> Faible</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
