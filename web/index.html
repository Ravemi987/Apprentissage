<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Simulation ASR</title>
    <!-- Lien vers le fichier CSS externe -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>Moniteur de Vol</h1>
        <p>Gérez le drone depuis le terminal C. Les liens colorent la qualité du signal.</p>
    </div>
    
    <!-- Conteneur principal -->
    <div class="simulation-container">
        <canvas id="simCanvas" width="800" height="600"></canvas>
        
        <!-- Petite légende pour comprendre les couleurs -->
        <div class="legend">
            <h3>Qualité du Signal</h3>
            <div class="legend-item"><span class="color-box" style="background: #a6e3a1;"></span> Excellent (Proche)</div>
            <div class="legend-item"><span class="color-box" style="background: #f9e2af;"></span> Moyen</div>
            <div class="legend-item"><span class="color-box" style="background: #f38ba8;"></span> Faible (Loin)</div>
        </div>
    </div>

    <!-- Lien vers le fichier JS externe -->
    <script src="app.js"></script>
</body>
</html>
